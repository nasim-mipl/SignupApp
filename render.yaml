databases:
  - name: signupapp-db
    databaseName: signupdb
    user: signupuser
    plan: free

services:
  - type: web
    name: signupapp
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: signupapp-db
          property: connectionString
